<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="0; url=/repertoire/">
<link rel="canonical" href="https://kt-lab.tw/repertoire/">
<title>動作總表已搬家</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#141414;color:#e8e8e8;font:16px/1.7 -apple-system,"PingFang TC",sans-serif;
text-align:center;padding:2rem}
a{color:#c9a66b}
</style>
</head><body>
<div>
<p>動作總表搬到新網址了。</p>
<p><a href="/repertoire/">https://kt-lab.tw/repertoire/</a></p>
<p style="font-size:.8rem;opacity:.7">沒有自動跳轉的話點上面的連結。<br>
主畫面上的舊圖示請刪掉，到新網址重新加一次。</p>
</div>
<script>
// 拆掉舊的 service worker 與快取，再轉走。
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.scope.includes("/asana/") ? r.unregister() : null));
    }
    if (window.caches) {
      const ks = await caches.keys();
      await Promise.all(ks.filter(k => k.startsWith("asana-")).map(k => caches.delete(k)));
    }
  } catch (e) {}
  location.replace("/repertoire/");
})();
</script>
</body></html>
