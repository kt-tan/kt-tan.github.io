const state={q:"",sets:{}};
for(const d of DIMS) state.sets[d]=new Set();
state.sets.level=new Set(); state.sets.source=new Set(); state.sets.equipment=new Set();
const el=id=>document.getElementById(id);
const norm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function match(m){
  for(const k of DIMS){
    const s=state.sets[k];
    if(s.size&&![...s].every(v=>m[k].includes(v)))return false;
  }
  if(state.sets.level.size&&!state.sets.level.has(m.level))return false;
  if(state.sets.source.size&&!m.source.some(v=>state.sets.source.has(v)))return false;
  if(state.sets.equipment.size&&!m.equipment.some(v=>state.sets.equipment.has(v)))return false;
  if(!state.q)return true;
  const q=norm(state.q);
  return [m.zh,m.en,m.sa,m.sa_iast,m.note].some(v=>norm(v).includes(q));
}
function active(){return Object.values(state.sets).reduce((n,s)=>n+s.size,0);}
function render(){
  const list=MOVES.filter(match), n=active();
  el("count").textContent=list.length+" 個動作"+(n?`（${n} 個篩選條件）`:"");

      ${m.note?`<div class="note">${m.note}</div>`:""}

}
document.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b)return;
  const s=state.sets[b.dataset.k];

});

});
